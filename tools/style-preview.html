<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Cozy Grove – Stilprobe</title>
<style>
  body { margin: 0; background: #2a2f28; color: #e8e2d2;
         font: 14px "Segoe UI", system-ui, sans-serif; padding: 18px; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 8px; letter-spacing: .02em; }
  h2 small { color: #a49c8a; font-weight: 400; }
  canvas { display: block; border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.45); }
  .row { margin-bottom: 22px; }
</style>
</head>
<body>
  <div class="row">
    <h2>Koloriert <small>— um zufriedene Geister und das Lagerfeuer herum</small></h2>
    <canvas id="colored" width="1100" height="620"></canvas>
  </div>
  <div class="row">
    <h2>Noch nicht koloriert <small>— der Rest der Insel wartet auf Farbe</small></h2>
    <canvas id="line" width="1100" height="620"></canvas>
  </div>

<script type="module">
import {
  blob, teardrop, smoothClosed, offsetShape, pathFrom,
  inkStroke, inkLine, wash, paintLayered, paperTexture, blurCanvas,
} from '../src/art/brush.js';
import {
  INK, paintTree, paintPine, paintRock, paintBush, paintFlower,
  paintGrassTuft, paintCampfire, paintScout, paintSpirit,
} from '../src/art/painted.js';
import { makeRng } from '../src/core/rng.js';

const W = 1100;
const H = 620;

/** Der Boden: große Aquarellflächen, danach die Küstenlinie in Tinte. */
function drawGround(ctx, mode) {
  const line = mode === 'line';
  ctx.fillStyle = INK.paper;
  ctx.fillRect(0, 0, W, H);

  // Wasserfläche (unten rechts), Küste verläuft diagonal
  // Küstenlinie mit ein paar Buchten – eine gerade Diagonale sähe
  // nach Landkarte aus, nicht nach Insel.
  const shore = smoothClosed([
    [W + 60, 70], [1010, 118], [900, 190], [806, 176], [720, 232],
    [612, 268], [520, 250], [452, 306], [352, 330], [268, 316],
    [190, 372], [96, 402], [30, 470], [-60, 540],
    [-60, H + 60], [W + 60, H + 60],
  ], 9);

  const layer = document.createElement('canvas');
  layer.width = W; layer.height = H;
  const g = layer.getContext('2d');

  // Wiese
  g.fillStyle = line ? '#efeade' : INK.grass;
  g.fillRect(0, 0, W, H);
  if (!line) {
    const rng = makeRng(9);
    for (let i = 0; i < 26; i++) {
      wash(g, smoothClosed(blob(rng() * W, rng() * H * 0.8, 60 + rng() * 90, 30 + rng() * 50, 100 + i, 0.22, 14), 5),
        rng() < 0.5 ? INK.grassLight : INK.grassDark, { seed: 200 + i, alpha: 0.3 });
    }
  }

  // Sandsaum entlang der Küste
  const sandBand = offsetShape(shore, 0, -34, 1.0);
  g.fillStyle = line ? '#f4f0e4' : INK.sand;
  pathFrom(g, sandBand, true);
  g.fill();
  if (!line) {
    wash(g, offsetShape(shore, 0, -14, 1.0), INK.sandShade, { seed: 44, alpha: 0.45 });
  }

  // Wasser
  g.fillStyle = line ? '#e7ecec' : INK.water;
  pathFrom(g, shore, true);
  g.fill();
  if (!line) {
    wash(g, offsetShape(shore, 40, 90, 1.02), INK.waterDeep, { seed: 51, alpha: 0.55 });
    wash(g, smoothClosed(blob(880, 470, 190, 110, 61, 0.24, 18), 6), INK.waterDark, { seed: 62, alpha: 0.5 });
    wash(g, smoothClosed(blob(300, 560, 150, 80, 63, 0.24, 18), 6), INK.waterDark, { seed: 64, alpha: 0.35 });
    // heller Saum direkt am Ufer
    wash(g, offsetShape(shore, 0, 16, 1.0), INK.waterLight, { seed: 66, alpha: 0.5 });
  }

  blurCanvas(layer, 5, 2);
  ctx.drawImage(layer, 0, 0);

  // Küstenlinie in Tinte
  const coastLine = shore.slice(0, shore.length - 27);
  inkStroke(ctx, coastLine, { closed: false, width: 3.4, vary: 0.35, seed: 71, color: INK.line });
  inkStroke(ctx, offsetShape(coastLine, 0, -30, 1.0),
    { closed: false, width: 2.2, vary: 0.4, seed: 72, color: INK.lineSoft, alpha: 0.5 });

  // Schaumkringel auf dem Wasser
  const rng2 = makeRng(303);
  ctx.strokeStyle = line ? 'rgba(120,120,110,.35)' : 'rgba(255,255,255,.75)';
  for (let i = 0; i < 16; i++) {
    const x = 120 + rng2() * (W - 200);
    const y = 260 + rng2() * (H - 280);
    const r = 8 + rng2() * 22;
    ctx.lineWidth = 1.6 + rng2() * 1.2;
    ctx.beginPath();
    ctx.arc(x, y, r, 0.4 + rng2(), 3.6 + rng2());
    ctx.stroke();
  }
}

/** Papierkorn über das ganze Bild. */
function grainOverlay(ctx) {
  const tile = paperTexture(256);
  const pat = ctx.createPattern(tile, 'repeat');
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = pat;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function scene(canvasId, mode) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  ctx.imageSmoothingEnabled = true;
  drawGround(ctx, mode);

  const items = [];
  function add(y, canvas, x, anchorY) {
    items.push({ y: y, c: canvas, x: x, ay: anchorY == null ? canvas.height : anchorY });
  }

  const m = mode;
  add(300, paintTree({ seed: 21, mode: m }), 150);
  add(250, paintTree({ seed: 34, mode: m, leaf: '#c2d06a', leafLight: '#dde59b', leafDark: '#93a94a' }), 330);
  add(200, paintPine({ seed: 55, mode: m }), 520);
  add(330, paintTree({ seed: 47, mode: m, fruit: INK.berry }), 640);
  add(180, paintPine({ seed: 91, mode: m }), 830);
  add(255, paintTree({ seed: 63, mode: m, leaf: '#b5cf6d' }), 985);

  add(390, paintRock({ seed: 77, mode: m }), 250);
  add(360, paintRock({ seed: 88, mode: m, ore: true }), 745);
  add(300, paintRock({ seed: 99, mode: m }), 900);

  add(410, paintBush({ seed: 91, mode: m, berries: true }), 430);
  add(345, paintBush({ seed: 96, mode: m }), 590);

  add(420, paintGrassTuft({ seed: 171, mode: m }), 200);
  add(395, paintGrassTuft({ seed: 175, mode: m }), 690);
  add(360, paintGrassTuft({ seed: 179, mode: m }), 880);

  add(430, paintFlower({ seed: 131, mode: m, petal: INK.petalPink }), 300);
  add(415, paintFlower({ seed: 137, mode: m, petal: INK.petalYellow }), 340);
  add(440, paintFlower({ seed: 141, mode: m, petal: INK.petalViolet }), 505);
  add(400, paintFlower({ seed: 147, mode: m, petal: INK.petalWhite }), 800);

  add(370, paintCampfire({ seed: 211, mode: m }), 420);
  add(345, paintSpirit({ seed: 401, mode: m, fur: '#dcd0b6', accent: '#d9705f' }), 560);
  add(400, paintScout({ seed: 301, mode: m }), 470);

  items.sort((a, b) => a.y - b.y);
  for (const it of items) {
    ctx.drawImage(it.c, Math.round(it.x - it.c.width / 2), Math.round(it.y - it.ay));
  }

  grainOverlay(ctx);

  // sanfte Ecken-Abdunklung
  const vign = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35,
    W / 2, H / 2, Math.max(W, H) * 0.72);
  vign.addColorStop(0, 'rgba(0,0,0,0)');
  vign.addColorStop(1, 'rgba(80,70,50,0.16)');
  ctx.fillStyle = vign;
  ctx.fillRect(0, 0, W, H);
}

scene('colored', 'color');
scene('line', 'line');
window.__previewReady = true;
</script>
</body>
</html>
